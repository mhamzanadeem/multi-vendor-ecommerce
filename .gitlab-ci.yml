stages: [verify, deploy, validate, release]
default:
  image: node:24-bookworm
  interruptible: true
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

acceptance:
  stage: verify
  # TEST_DB_URL comes from the masked project CI/CD variable (Atlas).
  script:
    - npm ci
    - mkdir -p reports
    - node --test --test-concurrency=1 --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=reports/acceptance.xml backend/tests/*.test.js
  artifacts:
    when: always
    expire_in: 90 days
    paths: [reports/]
    reports:
      junit: reports/acceptance.xml

frontend:
  stage: verify
  script:
    - npm ci --prefix frontend
    - npm run build --prefix frontend
  artifacts:
    expire_in: 90 days
    paths: [frontend/dist/]

# Opt-in scaffold. Configure separate demo services and verify scripts first.
# A staging frontend deployment must already be wired to the same commit.
deploy_staging:
  stage: deploy
  interruptible: false
  resource_group: guardian-staging
  rules:
    - if: '$GUARDIAN_CD_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - node scripts/deploy-render.js
  environment:
    name: staging
    url: $SMOKE_FRONTEND_URL

smoke_staging:
  stage: validate
  rules:
    - if: '$GUARDIAN_CD_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    EXPECTED_REVISION: $CI_COMMIT_SHA
  script:
    - node scripts/smoke-staging.js

approve_release:
  stage: release
  interruptible: false
  rules:
    - if: '$GUARDIAN_CD_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  allow_failure: false
  script:
    - 'echo "Approved staging revision: $CI_COMMIT_SHA. Production promotion is not configured."'
  # This records outcome approval only. It does not claim a production deployment.
